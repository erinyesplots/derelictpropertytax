<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Where would the Derelict Property Tax apply?</title>

  <link rel="stylesheet"
"https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
        .priceLabel {
    background: transparent;
    border: none;
    box-shadow: none;
    color: #666666;
    font-size: 10px;
    font-weight: bold;
    pointer-events: none;
}
.priceLabel:before {
    display: none;
}
    .legend {
    background: white;
    padding: 8px 10px;
    line-height: 18px;
    color: #333;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    font-size: 12px;
}

.legend i {
    width: 10px;
    height: 10px;
    float: left;
    margin-right: 6px;
    margin-top: 4px;
    border-radius: 50%;
}   
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.15, -7.15], 10);

const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const countiesLayer = L.layerGroup().addTo(map);
const coverageLayer = L.layerGroup().addTo(map);
const settlementsLayer = L.layerGroup().addTo(map);

// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "Counties": countiesLayer,
    "Derelict Sites Coverage": coverageLayer,
    "Settlements Under 2,000 Population": settlementsLayer
},
{
    collapsed: false
}
).addTo(map);
// Counties

fetch('data/Counties.geojson')
    .then(response => response.json())
    .then(data => {

        const counties = L.geoJSON(data, {
            style: {
                color: '#444444',
                weight: 2,
                fillOpacity: 0
            }
        }).addTo(countiesLayer);

        map.fitBounds(counties.getBounds());

    });

// Derelict Sites Coverage

fetch('data/DerelictSitesCoverage.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#d62828',
                weight: 2,
                fillColor: '#d62828',
                fillOpacity: 0.25
            }
        }).addTo(coverageLayer);

    });

// Settlements Under 2,000 Population

fetch('data/Under2kSettlements.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#1d3557',
                weight: 1,
                fillColor: '#457b9d',
                fillOpacity: 0.5
            }
        }).addTo(settlementsLayer);

    });
</script>

</body>
</html>
