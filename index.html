isti<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Derelict Property Tax Coverage</title>

  <link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
       
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');
    const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const countiesLayer = L.layerGroup().addTo(map);
const coverageLayer = L.layerGroup().addTo(map);
const proposedCoverageLayer = L.layerGroup().addTo(map);
const settlementsLayer = L.layerGroup().addTo(map);

// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "County Boundaries": countiesLayer,
    "Current Legislation": coverageLayer,
    "Proposed Legislation": proposedCoverageLayer,
    "Towns/Villages that will lose coverage": settlementsLayer
},
{
    collapsed: false
}
).addTo(map);
// Counties

fetch('data/Counties.geojson')
    .then(response => response.json())
    .then(data => {

        const counties = L.geoJSON(data, {
            style: {
                color: '#444444',
                weight: 2,
                fillOpacity: 0
            }
        }).addTo(countiesLayer);

        map.fitBounds(counties.getBounds());

    });
    
// Settlements Under 2,000 Population

fetch('data/Under2kSettlements.geojson')
    .then(response => response.json())
    .then(data => {

   L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
            radius: 4,
            fillColor: '#FF0000',
            color: '#1d3557',
            weight: 1,
            fillOpacity: 1
        });
    }
}).addTo(settlementsLayer);
    });
    
// Derelict Sites Coverage

fetch('data/DerelictSitesCoverage.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#d62828',
                weight: 1,
                fillColor: '#d62828',
                fillOpacity: 0.25
            }
        }).addTo(coverageLayer);

    });

// Proposed Property Tax Coverage

fetch('data/ProposedDSTaxAreas.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#2a9d8f',
                weight: 2,
                fillColor: '#2a9d8f',
                fillOpacity: 0.35
            }
        }).addTo(proposedCoverageLayer);

    });
</script>

</body>
</html>
