<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>Derelict Property Tax Coverage</title>

  <link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
        }

@media (max-width: 768px) {

    .legend {
        max-width: 220px !important;
        font-size: 10px !important;
    }

}
        
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {
    zoomSnap: 0.5
});
    const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const countiesLayer = L.layerGroup().addTo(map);
const coverageLayer = L.layerGroup().addTo(map);
const proposedCoverageLayer = L.layerGroup().addTo(map);
const settlementsLayer = L.layerGroup().addTo(map);
const dublinMaskLayer = L.layerGroup().addTo(map);
    
// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "County Boundaries": countiesLayer,
    "Existing Derelict Site Levy Areas": coverageLayer,
    "Proposed Derelict Site Property Tax Areas": proposedCoverageLayer,
    "Settlements currently covered by Levy but outside proposed Tax": settlementsLayer
},
{
    collapsed: window.innerWidth < 768
}
).addTo(map);
// Counties

fetch('data/Counties.geojson')
    .then(response => response.json())
    .then(data => {

        const counties = L.geoJSON(data, {
            style: {
                color: '#444444',
                weight: 2,
                fillOpacity: 0
            }
        }).addTo(countiesLayer);

map.fitBounds(counties.getBounds());

        setTimeout(() => {
            map.setZoom(map.getZoom() + 1);
        }, 100);

    });    
// Settlements Under 2,000 Population

fetch('data/Under2kSettlements.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {
                return L.circleMarker(latlng, {
                   radius: window.innerWidth < 768 ? 5 : 4,
                    fillColor: '#1565C0',
                    color: '#ffffff',
                    weight: 1,
                    fillOpacity: 0.9
                });
            },

            onEachFeature: function(feature, layer) {

layer.bindPopup(
    '<strong>' + feature.properties.Settlement + '</strong><br>' +
    'Population: ' + (feature.properties.Population ?? 'Not available')
);

            }

        }).addTo(settlementsLayer);

    });
    
// Derelict Sites Coverage

fetch('data/DerelictSitesCoverage.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
           interactive: false,
            
            style: {
                color: '#B22222',
                weight: 1,
                fillColor: '#E57373',
                fillOpacity: 0.25
            }
        }).addTo(coverageLayer);

    });

    // Dublin - not assessed area

fetch('data/Dublin.geojson')
    .then(response => response.json())
    .then(data => {

        const dublin = L.geoJSON(data, {
            interactive: false,
            style: {
                color: '#808080',
                weight: 0,
                fillColor: '#808080',
                fillOpacity: .8
            }
        }).addTo(dublinMaskLayer);

       });

// Proposed Property Tax Coverage

fetch('data/ProposedDSTaxAreas.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
          interactive: false,
            style: {
                color: '#00796B',
                weight: 2,
                fillColor: '#26A69A',
                fillOpacity: 0.4
            }
        }).addTo(proposedCoverageLayer);

    });
      
// Combined Legend and Map Note

const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {

    const div = L.DomUtil.create('div', 'info legend');

const mobile = window.innerWidth < 768;

div.innerHTML = `
<div style="
    background: rgba(255,255,255,0.95);
    padding: ${mobile ? '6px' : '12px'};
    border: 2px solid #666;
    border-radius: 5px;
    line-height: 1.3;
width: ${mobile ? '190px' : '320px'};
    font-size: ${mobile ? '9px' : '12px'};
">

${mobile ? `
<details>
<summary><strong>Legend</strong></summary>
<br>
` : `
<strong>Legend</strong><br><br>
`}
    <div>
        <span style="
            display:inline-block;
            width:18px;
            height:12px;
            background:#E57373;
            border:1px solid #B22222;
            margin-right:8px;">
        </span>
        ${mobile ? 'Current Levy' : 'Existing Derelict Site Levy Areas'}
    </div>

    <div style="margin-top:4px;">
        <span style="
            display:inline-block;
            width:18px;
            height:12px;
            background:#26A69A;
            border:1px solid #00796B;
            margin-right:8px;">
        </span>
        ${mobile ? 'Proposed Tax' : 'Proposed Derelict Property Tax Areas'}
    </div>

    <div style="margin-top:4px;">
        <span style="
            display:inline-block;
            width:10px;
            height:10px;
            background:#1565C0;
            border:1px solid white;
            border-radius:50%;
            margin-right:8px;">
        </span>
        ${mobile ? 'Covered by Levy/Excluded from Tax' : 'Settlements currently covered by Levy but outside proposed Tax'}
    </div>

    ${mobile ? '' : `
    <hr style="margin:10px 0;">

    <strong>Map Note</strong><br>

Blue dots show towns and villages currently covered by the Derelict Sites Levy but 
outside the proposed new tax because they have fewer than 2,000 residents per Census 2022. 
(Click dots for population details.) Whether these areas will lose the levy altogether
or remain reliant on the existing levy--with its historically low collection rates--remains unclear.<br><br>

Existing levy coverage reflects areas prescribed by local authorities and varies considerably
between counties. County Dublin was not assessed, given its predominantly urban character.    `}
</div>
`;
return div;

};

legend.addTo(map);
            
</script>

</body>
</html>
