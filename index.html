<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Derelict Property Tax Coverage</title>

  <link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
       
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');
    const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const countiesLayer = L.layerGroup().addTo(map);
const coverageLayer = L.layerGroup().addTo(map);
const proposedCoverageLayer = L.layerGroup().addTo(map);
const settlementsLayer = L.layerGroup().addTo(map);

// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "County Boundaries": countiesLayer,
    "Current Derelict Sites Levy Coverage": coverageLayer,
    "Proposed Derelict Property Tax Coverage": proposedCoverageLayer,
    "Settlements Under 2,000 Population": settlementsLayer
},
{
    collapsed: false
}
).addTo(map);
// Counties

fetch('data/Counties.geojson')
    .then(response => response.json())
    .then(data => {

        const counties = L.geoJSON(data, {
            style: {
                color: '#444444',
                weight: 2,
                fillOpacity: 0
            }
        }).addTo(countiesLayer);

        map.fitBounds(counties.getBounds());

    });
    
// Settlements Under 2,000 Population

fetch('data/Under2kSettlements.geojson')
    .then(response => response.json())
    .then(data => {

 L.geoJSON(data, {

    pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
            radius: 4,
            fillColor: '#457b9d',
            color: '#1d3557',
            weight: 1,
            fillOpacity: 1
        });
    },

    onEachFeature: function(feature, layer) {

        layer.bindPopup(
            '<b>' + feature.properties.Settlement + '</b><br>' +
            'Population: ' + feature.properties.Population + '<br>' +
                   );

    }

}).addTo(settlementsLayer);
    
// Derelict Sites Coverage

fetch('data/DerelictSitesCoverage.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: ''#B22222',
                weight: 1,
                fillColor: '#E57373',
                fillOpacity: 0.25
            }
        }).addTo(coverageLayer);

    });

// Proposed Property Tax Coverage

fetch('data/ProposedDSTaxAreas.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#00796B',
                weight: 2,
                fillColor: '#26A69A',
                fillOpacity: 0.30
            }
        }).addTo(proposedCoverageLayer);

    });

// Legend

const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {

    const div = L.DomUtil.create('div', 'info legend');

    div.innerHTML = `
        <div style="
            background: white;
            padding: 10px;
            border: 2px solid #666;
            border-radius: 5px;
            line-height: 1.6;
            max-width: 280px;
        ">
            <strong>Legend</strong><br><br>

            <div>
                <span style="
                    display:inline-block;
                    width:18px;
                    height:12px;
                    background:#e57373;
                    border:1px solid #B22222;
                    margin-right:8px;">
                </span>
                Current Derelict Sites Levy Coverage
            </div>

            <div>
                <span style="
                    display:inline-block;
                    width:18px;
                    height:12px;
                    background:#26A69A;
                    border:1px solid #00796B;
                    margin-right:8px;">
                </span>
                Proposed Derelict Property Tax Coverage
            </div>

            <div>
                <span style="
                    display:inline-block;
                    width:10px;
                    height:10px;
                    background:#1565C0;
                    border:1px solid white;
                    border-radius:50%;
                    margin-right:8px;">
                </span>
                Settlement under 2,000 population
            </div>
        </div>
    `;

    return div;
};

legend.addTo(map);

// Map Note

const note = L.control({ position: 'bottomleft' });

note.onAdd = function () {

    const div = L.DomUtil.create('div');

    div.innerHTML = `
        <div style="
            background: rgba(255,255,255,0.95);
            padding: 10px;
            border: 2px solid #666;
            border-radius: 5px;
            max-width: 320px;
            font-size: 12px;
            line-height: 1.4;
        ">
            <strong>Map Note</strong><br>
Blue dots indicate towns and villages with a population below
 2,000 (Census 2022), which would be excluded from the proposed
 Derelict Property Tax. Current Derelict Sites Levy coverage 
reflects areas prescribed by local authorities, so it varies 
significantly between counties.            
        </div>
    `;

    return div;
};

note.addTo(map);
        
</script>

</body>
</html>
