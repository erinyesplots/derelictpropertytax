<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Derelict Property Tax Coverage</title>

  <link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
       
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');
    const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const countiesLayer = L.layerGroup().addTo(map);
const coverageLayer = L.layerGroup().addTo(map);
const proposedCoverageLayer = L.layerGroup().addTo(map);
const settlementsLayer = L.layerGroup().addTo(map);
const dublinMaskLayer = L.layerGroup().addTo(map);
    
// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "County Boundaries": countiesLayer,
    "Current Derelict Sites Levy Coverage": coverageLayer,
    "Proposed Derelict Property Tax Coverage": proposedCoverageLayer,
    "Settlements that would lose coverage": settlementsLayer
},
{
    collapsed: false
}
).addTo(map);
// Counties

fetch('data/Counties.geojson')
    .then(response => response.json())
    .then(data => {

        const counties = L.geoJSON(data, {
            style: {
                color: '#444444',
                weight: 2,
                fillOpacity: 0
            }
        }).addTo(countiesLayer);

        map.fitBounds(counties.getBounds());

    });
    
// Settlements Under 2,000 Population

fetch('data/Under2kSettlements.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {
                return L.circleMarker(latlng, {
                    radius: 4,
                    fillColor: '#1565C0',
                    color: '#ffffff',
                    weight: 1,
                    fillOpacity: 0.9
                });
            },

            onEachFeature: function(feature, layer) {

layer.bindPopup(
    '<strong>' + feature.properties.Settlement + '</strong><br>' +
    'Population: ' + (feature.properties.Population ?? 'Not available')
);

            }

        }).addTo(settlementsLayer);

    });
    
// Derelict Sites Coverage

fetch('data/DerelictSitesCoverage.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
           interactive: false,
            
            style: {
                color: '#B22222',
                weight: 1,
                fillColor: '#E57373',
                fillOpacity: 0.25
            }
        }).addTo(coverageLayer);

    });

    // Dublin - not assessed area

fetch('data/Dublin.geojson')
    .then(response => response.json())
    .then(data => {

        const dublin = L.geoJSON(data, {
            interactive: false,
            style: {
                color: '#808080',
                weight: 0,
                fillColor: '#808080',
                fillOpacity: 1
            }
        }).addTo(dublinMaskLayer);

       });

// Proposed Property Tax Coverage

fetch('data/ProposedDSTaxAreas.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
          interactive: false,
            style: {
                color: '#00796B',
                weight: 2,
                fillColor: '#26A69A',
                fillOpacity: 0.30
            }
        }).addTo(proposedCoverageLayer);

    });
    
  
// Combined Legend and Map Note

const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {

    const div = L.DomUtil.create('div', 'info legend');

    div.innerHTML = `
        <div style="
            background: rgba(255,255,255,0.95);
            padding: 12px;
            border: 2px solid #666;
            border-radius: 5px;
            line-height: 1.5;
            max-width: 320px;
            font-size: 12px;
        ">

            <strong>Legend</strong><br><br>

            <div>
                <span style="
                    display:inline-block;
                    width:18px;
                    height:12px;
                    background:#E57373;
                    border:1px solid #B22222;
                    margin-right:8px;">
                </span>
                Current Derelict Sites Levy Coverage
            </div>

            <div style="margin-top:4px;">
                <span style="
                    display:inline-block;
                    width:18px;
                    height:12px;
                    background:#26A69A;
                    border:1px solid #00796B;
                    margin-right:8px;">
                </span>
                Proposed Derelict Property Tax Coverage
            </div>

            <div style="margin-top:4px;">
                <span style="
                    display:inline-block;
                    width:10px;
                    height:10px;
                    background:#1565C0;
                    border:1px solid white;
                    border-radius:50%;
                    margin-right:8px;">
                </span>
                Towns and villages that would lose coverage
            </div>

            <hr style="margin:10px 0;">

            <strong>Map Note</strong><br>

            Blue dots indicate towns and villages with a population below
            2,000 (Census 2022) that are currently covered by the Derelict
            Sites Levy but would be excluded from the proposed
            Derelict Property Tax. Click the dots to view population figures. <br><br>

            Current Derelict Sites Levy coverage reflects areas prescribed
            by local authorities, so it varies considerably between counties. County
            Dublin was not assessed.

        </div>
    `;

    return div;
};

legend.addTo(map);
        
</script>

</body>
</html>
